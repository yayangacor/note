apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.1.197:3000/fadmin/ComMX-Forgejo.git
    targetRevision: main
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: commx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
