---
# Longhorn sebagai CSI. Prasyarat open-iscsi + nfs-common + iscsid aktif
# sudah dipasang di role `common` -- kalau terlewat, volume menggantung
# di status attaching tanpa pesan error yang jelas.

- name: Pastikan prasyarat Longhorn ada di semua node
  ansible.builtin.command: systemctl is-active iscsid
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] }}"
  changed_when: false
  register: iscsid_check
  failed_when: iscsid_check.stdout | trim != "active"

- name: Tambah helm repo longhorn
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  become: false

- name: Install Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_version }}"
    release_namespace: longhorn-system
    create_namespace: true
    kubeconfig: "{{ kubeconfig }}"
    wait: true
    timeout: 20m
    values:
      persistence:
        defaultClass: true
        defaultClassReplicaCount: 2   # 6 node, 2 replika cukup dan hemat disk
  become: false

- name: Verifikasi StorageClass longhorn benar-benar ada
  kubernetes.core.k8s_info:
    kind: StorageClass
    name: longhorn
    kubeconfig: "{{ kubeconfig }}"
  become: false
  register: sc_longhorn
  failed_when: sc_longhorn.resources | length == 0
