---
# PALING AKHIR. Policy disallow-latest-tag memblokir instalasi komponen lain
# kalau dipasang lebih dulu -- banyak chart pihak ketiga memakai tag latest
# atau tidak punya label wajib (G-07).

- name: Tambah helm repo kyverno
  kubernetes.core.helm_repository:
    name: kyverno
    repo_url: https://kyverno.github.io/kyverno/
    force_update: true
  become: false

- name: Install Kyverno
  kubernetes.core.helm:
    name: kyverno
    chart_ref: kyverno/kyverno
    release_namespace: kyverno
    create_namespace: true
    kubeconfig: "{{ kubeconfig }}"
    wait: true
    timeout: 15m
  become: false

- name: Tunggu webhook Kyverno benar-benar melayani
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kyverno
    kubeconfig: "{{ kubeconfig }}"
    label_selectors:
      - "app.kubernetes.io/component=admission-controller"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  become: false

- name: Apply cluster policies
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig }}"
    template: policies.yaml.j2
  become: false

- name: Pengingat kontrol negatif
  ansible.builtin.debug:
    msg: >-
      Policy terpasang. BUKTIKAN dengan kontrol negatif, bukan dengan melihat
      daftar policy:
      kubectl run bad --image=nginx:latest -n {{ app_namespace }}   (harus DITOLAK)
      kubectl run bad2 --image=nginx:1.27 -n default                (harus DITOLAK)
      Policy yang tidak pernah menolak apa pun tidak membuktikan apa pun.
