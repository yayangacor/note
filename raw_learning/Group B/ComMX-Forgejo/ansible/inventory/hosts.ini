[control_plane]
k8s-cp-01 ansible_host=192.168.10.11
k8s-cp-02 ansible_host=192.168.10.12
k8s-cp-03 ansible_host=192.168.10.13

[workers]
k8s-worker-01 ansible_host=192.168.10.21
k8s-worker-02 ansible_host=192.168.10.22
k8s-worker-03 ansible_host=192.168.10.23

# HAProxy + keepalived menumpang di 2 control plane (stacked).
# KEDUANYA WAJIB SATU SUBNET -- VRRP protokol Layer 2, tidak lewat router (G-02).
# Kalau cp-03 ada di subnet lain, jangan dimasukkan ke grup ini.
[loadbalancer]
k8s-cp-01 keepalived_state=MASTER keepalived_priority=110
k8s-cp-02 keepalived_state=BACKUP keepalived_priority=100

# Node yang boleh jadi MetalLB speaker: HANYA yang sesubnet dengan
# metallb_pool_start/end, karena ARP tidak melewati router (G-03).
[speaker]
k8s-cp-01
k8s-cp-02
k8s-worker-01
k8s-worker-02
k8s-worker-03

# VM Ubuntu terpisah, DI LUAR cluster: Forgejo + registry + runner (D-08).
[cicd]
cicd-01 ansible_host=192.168.1.197

# Mesin tempat kubectl dipakai (boleh sama dengan cicd).
[operator]
cicd-01 ansible_host=192.168.1.197

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
