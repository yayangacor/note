# Prasyarat: metrics-server terpasang dan `kubectl top nodes` sudah memberi
# angka. Tanpa itu HPA hanya menampilkan <unknown> dan tidak pernah menskala.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: commx-prod
  labels:
    app: backend
    owner: group-1
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: commx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
