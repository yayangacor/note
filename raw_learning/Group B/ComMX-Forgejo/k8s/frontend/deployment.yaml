apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: commx-prod
  labels: &labels
    app: frontend
    owner: group-1
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: commx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: *labels
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      containers:
        - name: frontend
          image: commx-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # CATATAN PENTING (G-04): frontend TIDAK menerima URL lewat env di
          # sini. Next.js membakar NEXT_PUBLIC_* saat `npm run build`, jadi
          # wss:// dan https:// dikirim sebagai --build-arg di pipeline CI.
          # Menaruhnya di sini tidak berpengaruh apa pun.
          readinessProbe:
            httpGet:
              path: /frontend
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: registry-credentials
