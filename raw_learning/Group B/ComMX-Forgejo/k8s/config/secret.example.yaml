# SALIN jadi k8s/config/secret.yaml, isi nilainya, lalu:
#   kubectl apply -f k8s/config/secret.yaml
#
# secret.yaml TIDAK BOLEH di-commit -- sudah ditutup .gitignore, dan role
# `security` akan menggagalkan playbook kalau ia sampai ter-track.
#
# Backend membaca ENAM env. Versi lama manifest hanya menyetel dua, sehingga
# app.listen(process.env.PORT) menerima undefined (G-11). PORT dan NODE_ENV
# datang dari ConfigMap; empat sisanya dari Secret ini.
apiVersion: v1
kind: Secret
metadata:
  name: commx-secret
  namespace: commx-prod
  labels:
    app: commx
    owner: group-1
    app.kubernetes.io/name: commx-secret
    app.kubernetes.io/part-of: commx
type: Opaque
stringData:
  POSTGRES_USER: "<POSTGRES_USER>"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  POSTGRES_DB: "<POSTGRES_DB>"

  DATABASE_URL: "postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>"

  # Bangkitkan dengan: openssl rand -base64 32
  JWT_SECRET: "<JWT_SECRET>"

  # Redis dijalankan dengan --requirepass, jadi password WAJIB masuk ke URL.
  # Tanpa itu backend gagal connect dan gejalanya terlihat seperti Redis mati.
  REDIS_URL: "redis://:<REDIS_PASSWORD>@redis:6379"
  REDIS_PASSWORD: "<REDIS_PASSWORD>"

  # WAJIB persis sama dengan origin yang dipakai browser, termasuk https://.
  # Kalau salah, CORS memblokir WSS dan gejalanya menyamar jadi masalah jaringan.
  SOCKET_ORIGIN: "https://commx.local.com"
