---
- name: Install dependencies for Kubernetes repositories
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Remove decommissioned baltocdn Helm repository
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/helm.list
    - /etc/apt/keyrings/helm-apt-keyring.asc

- name: Download Kubernetes signing key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: true

- name: Verify Kubernetes key is a valid PGP block
  command: gpg --show-keys /etc/apt/keyrings/kubernetes-apt-keyring.asc
  changed_when: false

- name: Configure Kubernetes apt repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /\n"
    mode: '0644'
  register: k8s_repo

- name: Refresh apt cache after repository change
  apt:
    update_cache: true
  when: k8s_repo.changed
- name: Install kubelet, kubeadm, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Pin Kubernetes package versions
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Disable swap for current session
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable swap permanently in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+sw\s+.*)$'
    replace: '# \1'
