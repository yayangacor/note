---
- name: Initialize Kubernetes cluster via kubeadm
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --pod-network-cidr=10.244.0.0/16
      --cri-socket=unix:///var/run/containerd/containerd.sock
  register: kubeadm_init
  changed_when: "'Your Kubernetes control-plane has initialized successfully!' in kubeadm_init.stdout"

- name: Create .kube configuration directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copy admin.conf to user's kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'

- name: Generate worker node join token command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: join_command_output
  changed_when: false

- name: Share join command across playbook hosts
  ansible.builtin.set_fact:
    kubernetes_join_command: "{{ join_command_output.stdout }}"
  delegate_to: localhost
  delegate_facts: true
