---
- name: Check installed Helm version
  command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download and verify Helm binary
  get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
    mode: '0644'
  when: helm_version not in (helm_check.stdout | default(''))

- name: Extract Helm binary
  unarchive:
    src: "/tmp/helm-{{ helm_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: helm_version not in (helm_check.stdout | default(''))

- name: Install Helm to /usr/local/bin
  copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: true
  when: helm_version not in (helm_check.stdout | default(''))
